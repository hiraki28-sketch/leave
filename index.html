const DUTY_HTML="<!DOCTYPE html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ระบบจัดเวร<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js\"><\/script>\n<style>\n  :root { --ink:#1d2433; --mut:#6b7385; --line:#d9deea; --brand:#1f4e8c; --bg:#f4f6fa; --ok:#1b7f4b; --bad:#b3261e; }\n  * { box-sizing:border-box; }\n  body { margin:0; font-family:'Sarabun',sans-serif; color:var(--ink); background:var(--bg); font-size:16px; }\n  header { background:var(--brand); color:#fff; padding:14px 16px; }\n  header h1 { margin:0; font-size:20px; font-weight:600; }\n  nav { display:flex; gap:6px; padding:10px 12px 0; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; overflow-x:auto; }\n  nav button { border:0; background:none; padding:10px 14px; font:inherit; color:var(--mut); border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }\n  nav button.on { color:var(--brand); border-color:var(--brand); font-weight:600; }\n  main { max-width:1180px; margin:0 auto; padding:14px; }\n  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }\n  .card h2 { margin:0 0 10px; font-size:17px; }\n  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }\n  label { display:block; font-size:14px; color:var(--mut); margin-bottom:3px; }\n  input, select, textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:100%; }\n  textarea { width:100%; min-height:90px; }\n  button.btn { font:inherit; border:0; border-radius:8px; padding:9px 16px; background:var(--brand); color:#fff; cursor:pointer; }\n  button.btn.alt { background:#fff; color:var(--brand); border:1px solid var(--brand); }\n  button.btn.red { background:var(--bad); }\n  button.btn:disabled { opacity:.5; cursor:wait; }\n  .hint { color:var(--mut); font-size:14px; }\n  .warn { background:#fff6e0; border:1px solid #f0d58a; color:#7a5a00; padding:8px 12px; border-radius:8px; margin-bottom:10px; font-size:15px; }\n  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:20px; display:none; z-index:50; max-width:90%; }\n  #toast.err { background:var(--bad); }\n  table.grid { border-collapse:collapse; width:100%; font-size:15px; }\n  table.grid th, table.grid td { border:1px solid var(--line); padding:6px; text-align:left; vertical-align:middle; }\n  table.grid th { background:#eef2f9; }\n  table.grid input, table.grid select { width:100%; min-width:120px; }\n  .hide { display:none !important; }\n  .scroll { overflow-x:auto; }\n  .dayline { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }\n  .dayline label { display:flex; align-items:center; gap:6px; background:#f4f6fa; border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin:0; color:var(--ink); }\n  .task { display:grid; grid-template-columns:150px 1fr; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center; }\n  .task .f { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }\n  .task .f select { flex:1 1 260px; }\n  .tick { color:var(--ok); font-weight:600; }\n  .gday { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); }\n  .gday b { white-space:nowrap; }\n\n  /* ---------- กระดาษตารางเวร ---------- */\n  #paperWrap { overflow:hidden; background:#e9ecf3; border:1px solid var(--line); border-radius:8px; }\n  .paper { width:1123px; background:#fff; color:#000; padding:36px 48px 40px; font-family:'Sarabun',sans-serif; font-size:15px; line-height:1.45; transform-origin:top left; }\n  .paper h3 { margin:0; text-align:center; font-size:19px; font-weight:700; line-height:1.5; }\n  .paper table { width:100%; border-collapse:collapse; table-layout:fixed; margin-top:14px; }\n  .paper th, .paper td { border:1px solid #000; padding:3px 8px; font-size:15px; }\n  .paper th { text-align:center; font-weight:700; }\n  .paper td.c { text-align:center; white-space:nowrap; }\n  .pgrid { display:grid; grid-template-columns:105px repeat(4, 1fr); margin-top:16px; }\n  .pgrid > div { padding:0 10px; }\n  .pgrid h4 { margin:0; text-align:center; font-size:16px; font-weight:700; }\n  .pgrid .sub { font-weight:600; margin-top:2px; }\n  .pgrid ol { margin:0; padding:0; list-style:none; }\n  .pgrid li { display:flex; gap:6px; }\n  .pgrid li span.n { flex:0 0 auto; }\n  .sig { text-align:center; }\n  .sig .l { text-align:left; padding-left:14px; }\n  .lblnote { margin-top:22px; font-weight:700; }\n  .pend { color:#999; }\n  /* ---------- หน้าพิมพ์ A4 แนวนอน (1123x794 px = 297x210 มม.) ตัวอักษรรายชื่อ 16pt ---------- */\n  .paper.pp { width:1123px; height:794px; padding:26px 36px; overflow:hidden; position:relative; font-size:12.67px; }\n  .paper.pp h3 { font-size:16px; }\n  .paper.pp h3.short { font-size:14px; }\n  .paper.pp th, .paper.pp td { font-size:12.67px; padding:3px 8px; line-height:1.4; }\n  .paper.pp .pgrid { grid-template-columns:90px repeat(4, 1fr); margin-top:14px; }\n  .paper.pp .pgrid h4 { font-size:13.5px; }\n  .paper.pp .pno { position:absolute; right:36px; bottom:8px; font-size:13px; color:#555; }\n\n<\/style>\n<\/head>\n<body>\n<nav>\n  <button id=\"t-view\" class=\"on\" onclick=\"tab('view')\">ตารางเวร<\/button>\n  <button id=\"t-group\" onclick=\"tab('group')\">ใส่ชื่อเวรของหมู่<\/button>\n  <button id=\"t-admin\" class=\"hide\" onclick=\"tab('admin')\">จัดการตาราง (แอดมินหลัก)<\/button>\n<\/nav>\n<main>\n\n<\u0021-- ================= ตารางเวร ================= -->\n<section id=\"s-view\">\n  <div class=\"card\">\n    <div class=\"row\">\n      <div><label>เดือน<\/label><select id=\"monthSel\" onchange=\"onMonthChange()\"><\/select><\/div>\n      <button class=\"btn\" onclick=\"exportPaper('pdf')\">ดาวน์โหลด PDF<\/button>\n      <button class=\"btn\" onclick=\"exportPaper('png')\">ดาวน์โหลดภาพ (PNG)<\/button>\n      <button class=\"btn\" onclick=\"exportExcel()\">ดาวน์โหลด Excel<\/button>\n      <button class=\"btn alt\" onclick=\"reloadAll()\">รีเฟรช<\/button>\n    <\/div>\n    <div id=\"pendingBox\" class=\"warn hide\" style=\"margin-top:10px\"><\/div>\n  <\/div>\n  <div id=\"paperWrap\"><div id=\"paper\" class=\"paper\"><\/div><\/div>\n  <p class=\"hint\">ภาพและ PDF ที่ดาวน์โหลดคือหน้าตารางด้านบน พร้อมพิมพ์ติดบอร์ด<\/p>\n\n  <div class=\"card\" id=\"gdayCard\">\n    <h2>เวรกลุ่มรายวัน <span class=\"hint\">(แจ้งแต่ละกลุ่มว่าวันไหนเป็นเวร)<\/span><\/h2>\n    <div id=\"gdayList\"><\/div>\n    <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn alt\" onclick=\"copyGroupDays()\">คัดลอกเป็นข้อความ (ส่ง LINE)<\/button><\/div>\n    <textarea id=\"gdayText\" class=\"hide\" style=\"margin-top:8px;min-height:160px\" readonly><\/textarea>\n  <\/div>\n<\/section>\n\n<\u0021-- ================= ตัวแทนกลุ่ม ================= -->\n<section id=\"s-group\" class=\"hide\">\n  <div class=\"card\">\n    <h2>ใส่ชื่อผู้เข้าเวร<\/h2>\n    <div class=\"row\">\n      <div id=\"gSelBox\" class=\"hide\"><label>หมู่<\/label><select id=\"gSel\"><\/select><\/div>\n      <div><label>เดือน<\/label><select id=\"gMonth\"><\/select><\/div>\n      <button class=\"btn\" onclick=\"groupLoad()\">แสดงเวรของหมู่<\/button>\n    <\/div>\n    <p class=\"hint\">เลือกผู้เข้าเวรจากรายชื่อสมาชิกหมู่ของท่านเท่านั้น (ตำแหน่งละ 1 นาย) แล้วกด \"บันทึก\" — แก้ไขได้จนกว่าจะพิมพ์ตาราง • อาจารย์ดูได้อย่างเดียว<\/p>\n  <\/div>\n  <div id=\"gTasks\"><\/div>\n<\/section>\n\n<\u0021-- ================= ผู้ดูแล ================= -->\n<section id=\"s-admin\" class=\"hide\">\n  <div id=\"aBody\">\n    <div class=\"card\">\n      <h2>1) ลำดับหมุนเวรของหมู่<\/h2>\n      <p class=\"hint\">รายชื่อ/หมู่/ชื่อเล่น มาจากแท็บ Roster และข้อมูลเพื่อนโดยอัตโนมัติ (ไม่ต้องนำเข้าซ้ำ)<\/p>\n      <label>ลำดับหมุนเวรของหมู่ (หมู่ 1 → 6 คั่นด้วยจุลภาค)<\/label>\n      <input id=\"groupOrder\" style=\"width:100%\" placeholder=\"เสือ, สิงโต, โลมา, ฉลาม, อินทรี, เหยี่ยว\">\n      <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn alt\" onclick=\"saveGroupOrder()\">บันทึกลำดับหมู่<\/button><\/div>\n      <div id=\"groupOrderNow\" class=\"hint\" style=\"margin-top:6px\"><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>2) ตารางนายทหารเวร / ผู้ช่วย (จากไฟล์ นทน.)<\/h2>\n      <p class=\"hint\">ดึงจากไฟล์ \"ตารางเวรปฏิบัติราชการ นทน.\" เดียวกับระบบลา ไฟล์ปรับปรุงเมื่อไรกดดึงใหม่ได้ — ตารางเวรที่สร้างไว้แล้วจะอัปเดตตามอัตโนมัติ<\/p>\n      <label>ลิงก์ไฟล์ตารางเวร นทน. (Google Sheet)<\/label>\n      <input id=\"dutyUrl\" style=\"width:100%\">\n      <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn\" onclick=\"syncDuty()\">ดึงจากไฟล์<\/button><span id=\"dutyInfo\" class=\"hint\"><\/span><\/div>\n      <details style=\"margin-top:10px\"><summary class=\"hint\">ดึงอัตโนมัติไม่ได้? วางข้อมูลจากชีตเอง<\/summary>\n        <textarea id=\"dutyPaste\" placeholder=\"คัดลอกคอลัมน์ วัน/วันที่, นายทหารเวร, ผู้ช่วยนายทหารเวร จากชีต แล้ววางที่นี่\"><\/textarea>\n        <div class=\"row\" style=\"margin-top:6px\"><button class=\"btn alt\" onclick=\"pasteDuty()\">นำเข้าจากข้อความที่วาง<\/button><\/div>\n      <\/details>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>3) สร้างตารางเวรประจำเดือน<\/h2>\n      <div class=\"row\">\n        <div><label>เดือน<\/label><input type=\"month\" id=\"genMonth\" onchange=\"renderGenDays()\"><\/div>\n        <div><label>กลุ่มที่เริ่มเดือนนี้ (ว่าง = ต่อจากเดือนก่อน)<\/label><select id=\"genSG\"><\/select><\/div>\n      <\/div>\n      <div class=\"hint\" style=\"margin-top:8px\">วันเรียน (ถ้ามีข้อมูลในตารางนายทหารเวร จะติ๊กตามวันที่ในตารางนั้นให้ — ปรับได้):<\/div>\n      <div id=\"genDays\" class=\"dayline\"><\/div>\n      <div class=\"row\"><button class=\"btn\" onclick=\"generate()\">สร้าง / สร้างใหม่ทั้งเดือน<\/button><button class=\"btn red\" onclick=\"deleteMonth()\">ลบตารางเดือนที่เลือกด้านบน<\/button><\/div>\n      <p class=\"hint\">เวรรับรอง+เวรแนะนำ: วันละ 1 กลุ่ม หมุนตามลำดับกลุ่ม • ถ้าสร้างเดือนเดิมซ้ำ ชื่อที่กลุ่มใส่แล้วและกลุ่มไม่เปลี่ยนจะคงไว้<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>4) แก้ไขรายวัน <span class=\"hint\" id=\"editMonthLbl\"><\/span><\/h2>\n      <div class=\"scroll\"><table class=\"grid\" id=\"editTbl\"><\/table><\/div>\n      <datalist id=\"allPeople\"><\/datalist>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>5) หัวกระดาษ หน้าที่ หมายเหตุ ผู้ลงนาม<\/h2>\n      <div id=\"cfgForm\"><\/div>\n      <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn\" onclick=\"saveCfg()\">บันทึกการตั้งค่า<\/button><\/div>\n    <\/div>\n\n      <\/div>\n<\/section>\n<\/main>\n<div id=\"toast\"><\/div>\n\n<script>\nconst TH_M_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];\nconst TH_M_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];\nconst TH_DOW = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];\nconst $ = id => document.getElementById(id);\nlet state = { cfg:{}, months:[], groups:[], days:[], ym:'', nicks:{} };\nlet adminData = null, gSession = null, ME = null;\n\nfunction thDigits(s){ return String(s).replace(/\\d/g, d => '๐๑๒๓๔๕๖๗๘๙'[d]); }\nfunction esc(s){ return String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\nfunction parts(iso){ const [y,m,d] = iso.split('-').map(Number); return {y,m,d}; }\nfunction dow(iso){ const p = parts(iso); return TH_DOW[new Date(p.y, p.m-1, p.d).getDay()]; }\nfunction fmtThai(iso){ const p = parts(iso); return thDigits(p.d) + ' ' + TH_M_SHORT[p.m-1] + thDigits(String(p.y+543).slice(-2)); }\nfunction fmtArabic(iso){ const p = parts(iso); return dow(iso) + ' ' + p.d + ' ' + TH_M_SHORT[p.m-1] + ' ' + String(p.y+543).slice(-2); }\nfunction normName(s){ return String(s || '').replace(/\\s+/g, ' ').trim(); }\n// ชื่อเต็ม + (ชื่อเล่น) ถ้ามีข้อมูลชื่อเล่น\nfunction withNick(name, nicks){ const n = (nicks || state.nicks || {})[normName(name)]; return esc(name) + (n ? ' (' + esc(n) + ')' : ''); }\n// แยกยศ / ชื่อ / คำลงท้าย ผู้ลงนาม (ถ้ายศและคำลงท้ายว่าง จะแยกจากช่องชื่อที่พิมพ์รวมกันไว้เดิมให้อัตโนมัติ)\nfunction signerParts(c){\n  if (c.signerRank || c.signerSuffix) return { rank: c.signerRank || '', name: c.signerName || '', suffix: c.signerSuffix || '' };\n  let n = normName(c.signerName || ''), rank = '', suffix = '';\n  const m = n.match(/^(\\S*\\.\\S*)\\s+(.*)$/); if (m) { rank = m[1]; n = m[2]; }\n  const q = n.match(/^(.*?)\\s*(ร\\.น\\.)$/); if (q) { n = q[1]; suffix = q[2]; }\n  return { rank, name: n, suffix };\n}\nfunction ymLabel(ym){ const [y,m] = ym.split('-').map(Number); return TH_M_FULL[m-1] + ' ' + (y+543); }\n\nlet _rpcId = 0; const _pend = {};\nwindow.addEventListener('message', e => { const m = e.data || {}; if (m.k !== 'rpc-res' || !_pend[m.id]) return; const p = _pend[m.id]; delete _pend[m.id]; m.ok ? p.res(m.data) : p.rej(new Error(m.error || 'ผิดพลาด')); });\n// เรียกเซิร์ฟเวอร์ผ่านหน้าหลักของระบบลา (หน้าหลักเติม session token ให้เอง)\nfunction call(fn, ...args){ return new Promise((res, rej) => { const id = ++_rpcId; _pend[id] = { res, rej }; parent.postMessage({ k: 'rpc', id, fn, args }, '*'); }); }\nfunction gl(g){ g = String(g || ''); return g && !/^หมู่/.test(g) ? 'หมู่' + g : g; }\nfunction toast(msg, err){ const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', err ? 5000 : 2200); }\nasync function guard(btn, fn){\n  if (btn) btn.disabled = true;\n  try { return await fn(); } catch (e) { toast((e && e.message ? e.message : String(e)).replace(/^Error:\\s*/, ''), true); }\n  finally { if (btn) btn.disabled = false; }\n}\nfunction groupOptions(sel, blank){\n  return (blank ? '<option value=\"\">' + blank + '<\/option>' : '') + state.groups.map(g => `<option value=\"${esc(g)}\" ${g === sel ? 'selected' : ''}>${esc(gl(g))}<\/option>`).join('');\n}\n\nfunction tab(n){\n  ['view','group','admin'].forEach(k => { $('s-'+k).classList.toggle('hide', k !== n); $('t-'+k).classList.toggle('on', k === n); });\n  if (n === 'view') fitPaper();\n}\n\n// ---------- เริ่มต้น ----------\nasync function init(){\n  try {\n    const r = await call('dty_init');\n    state.cfg = r.cfg; state.months = r.months || []; state.groups = r.groups || []; ME = r.me;\n    fillMonthSelects();\n    $('t-admin').classList.toggle('hide', !ME.isSuper);\n    $('t-group').classList.toggle('hide', ME.role !== 'admin');\n    $('gSelBox').classList.toggle('hide', !ME.isSuper);\n    $('gSel').innerHTML = groupOptions(ME.group);\n    if (ME.isSuper) { try { await adminReloadData(); } catch (e) { toast('โหลดหน้าจัดการไม่สำเร็จ: ' + (e.message || e), true); } }\n    if (state.ym) await loadMonth(state.ym); else { state.days = []; renderPaper(); }\n  } catch (e) { toast('โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e), true); }\n}\nfunction fillMonthSelects(){\n  const opts = state.months.length ? state.months.map(m => `<option value=\"${m}\">${ymLabel(m)}<\/option>`).join('') : '<option value=\"\">(ยังไม่มีตาราง)<\/option>';\n  $('monthSel').innerHTML = opts; $('gMonth').innerHTML = opts;\n  if (!state.ym || state.months.indexOf(state.ym) < 0) state.ym = state.months[0] || '';\n  $('monthSel').value = state.ym; $('gMonth').value = state.ym;\n}\nasync function loadMonth(ym){\n  state.ym = ym;\n  if (!ym) { state.days = []; renderPaper(); return; }\n  const r = await call('dty_month', ym);\n  state.cfg = r.cfg; state.days = r.days; state.nicks = r.nicks || {};\n  renderPaper(); renderEdit();\n}\nasync function onMonthChange(){ await guard(null, () => loadMonth($('monthSel').value)); $('gMonth').value = state.ym; }\nasync function reloadAll(){ await init(); toast('รีเฟรชแล้ว'); }\n\n// ---------- กระดาษตารางเวร ----------\nfunction dutyList(text, verb){\n  const lines = String(text || '').split('\\n').map(s => s.trim()).filter(Boolean);\n  const body = lines.length === 1\n    ? `<li><span class=\"n\">-<\/span><span>${esc(lines[0])}<\/span><\/li>`\n    : lines.map((l, i) => `<li><span class=\"n\">${thDigits(i+1)}.<\/span><span>${esc(l)}<\/span><\/li>`).join('');\n  return `<div class=\"sub\">${verb}<\/div><ol>${body}<\/ol>`;\n}\n// ชิ้นส่วนของตาราง (ใช้ทั้งหน้าจอและตอนแบ่งหน้าพิมพ์)\nfunction rosterParts(){\n  const c = state.cfg, days = state.days;\n  const ym = state.ym || '';\n  const sub = ym ? 'ประจำเดือน ' + TH_M_FULL[+ym.slice(5)-1] + ' ' + thDigits(+ym.slice(0,4)+543) : '';\n  const cell = v => v ? withNick(v) : '<span class=\"pend\">-<\/span>';\n  const rowHTML = d => `<tr><td class=\"c\">${fmtThai(d.date)}<\/td><td>${cell(d.ntn)}<\/td><td>${cell(d.asst)}<\/td><td>${cell(d.recvName)}<\/td><td>${cell(d.guideName)}<\/td><\/tr>`;\n  const notes = String(c.notes || '').split('\\n').map(s => s.trim()).filter(Boolean).map(s => `<div>- ${esc(s)}<\/div>`).join('');\n  const sp = signerParts(c);\n  // ชื่อกับสกุลเว้น 2 ช่องว่าง (ใช้ &nbsp; เพื่อไม่ให้เบราว์เซอร์ยุบช่องว่าง) — ไม่มีชื่อให้ใช้เส้นจุดแทน\n  const nameTwoSp = sp.name ? normName(sp.name).split(' ').map(esc).join('&nbsp; ') : '';\n  const sigLine = '(ลงชื่อ) ' + (sp.rank ? esc(sp.rank) + ' ' : '') + (nameTwoSp || '..............................') + (sp.suffix ? ' ' + esc(sp.suffix) : '');\n  const nameLine = '(' + (nameTwoSp || '................................') + ')';\n  const sd = c.signDate ? fmtThai(c.signDate) : '';\n  return {\n    c, days, rowHTML,\n    titleHTML: `<h3>${esc(c.title)}<br>${sub}<\/h3>`,\n    shortTitleHTML: `<h3 class=\"short\">${esc(c.title)} ${sub} (ต่อ)<\/h3>`,\n    headHTML: first => `<colgroup><col style=\"width:${first}px\"><col><col><col><col><\/colgroup>\n      <thead><tr><th>วันที่<\/th><th>${esc(c.roleNtn)}<\/th><th>${esc(c.roleAsst)}<\/th><th>${esc(c.roleRecv)}<\/th><th>${esc(c.roleGuide)}<\/th><\/tr><\/thead>`,\n    footerHTML: () => `<div class=\"pgrid\">\n      <div><\/div>\n      <div><h4>${esc(c.roleNtn)}<\/h4>${dutyList(c.dutyNtn, 'มีหน้าที่')}<\/div>\n      <div><h4>${esc(c.roleAsst)}<\/h4>${dutyList(c.dutyAsst, 'มีหน้าที่')}<\/div>\n      <div><h4>${esc(c.roleRecv)}<\/h4>${dutyList(c.dutyRecv, 'ทำหน้าที่')}<\/div>\n      <div><h4>${esc(c.roleGuide)}<\/h4>${dutyList(c.dutyGuide, 'ทำหน้าที่')}<\/div>\n      <div class=\"lblnote\">หมายเหตุ<\/div>\n      <div style=\"grid-column:2 / span 2; margin-top:22px\">${notes}<\/div>\n      <div class=\"sig\" style=\"grid-column:4 / span 2; margin-top:22px\">\n        <div class=\"l\">${esc(c.signLabel)}<\/div>\n        <div style=\"position:relative;left:-5ch\">${sigLine}<\/div>\n        <div style=\"position:relative;left:-4ch\">\n          <div>${nameLine}<\/div>\n          <div>${esc(c.signerTitle)}<\/div>\n          <div>${sd}<\/div>\n        <\/div>\n      <\/div>\n    <\/div>`\n  };\n}\nfunction rosterHTML(){\n  const P = rosterParts();\n  const rows = P.days.map(P.rowHTML).join('');\n  return P.titleHTML + `<table>${P.headHTML(105)}<tbody>${rows || '<tr><td colspan=\"5\" style=\"text-align:center;color:#888\">ยังไม่มีตารางเวรของเดือนนี้<\/td><\/tr>'}<\/tbody><\/table>` + P.footerHTML();\n}\nfunction renderPaper(){\n  $('paper').innerHTML = rosterHTML();\n  const pend = state.days.reduce((n, d) => n + (d.recvName ? 0 : 1) + (d.guideName ? 0 : 1) + (d.ntn ? 0 : 1) + (d.asst ? 0 : 1), 0);\n  const box = $('pendingBox');\n  if (state.days.length && pend) {\n    const miss = {};\n    state.days.forEach(d => { if (!d.recvName || !d.guideName) miss[d.recvGroup] = true; });\n    const g = Object.keys(miss);\n    box.textContent = 'ยังมีช่องว่าง ' + pend + ' ช่อง' + (g.length ? ' • กลุ่มที่ยังไม่ใส่ชื่อ: ' + g.map(gl).join(', ') : '');\n    box.classList.remove('hide');\n  } else box.classList.add('hide');\n  renderGroupDays();\n  fitPaper();\n}\nfunction fitPaper(){\n  const wrap = $('paperWrap'), p = $('paper');\n  if (!wrap || !p) return;\n  p.style.transform = 'none';\n  const s = Math.min(1, (wrap.clientWidth || 1123) / 1123);\n  p.style.transform = 'scale(' + s + ')';\n  wrap.style.height = Math.ceil(p.offsetHeight * s) + 'px';\n}\nwindow.addEventListener('resize', fitPaper);\nif (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPaper);\n\n// ---------- เวรกลุ่มรายวัน ----------\nfunction renderGroupDays(){\n  $('gdayCard').classList.toggle('hide', !state.days.length);\n  $('gdayList').innerHTML = state.days.map(d => `<div class=\"gday\"><b>${fmtArabic(d.date)}<\/b><span>${esc(gl(d.recvGroup))}${d.recvGroup !== d.guideGroup ? ' / ' + esc(gl(d.guideGroup)) : ''}<\/span><\/div>`).join('');\n  $('gdayText').classList.add('hide');\n}\nfunction copyGroupDays(){\n  const c = state.cfg, ym = state.ym;\n  let t = 'เวรกลุ่มรายวัน เดือน ' + ymLabel(ym) + '\\n(' + c.roleRecv + ' / ' + c.roleGuide + ' ตำแหน่งละ 1 นาย)\\n\\n';\n  state.days.forEach(d => { t += fmtArabic(d.date) + ' ' + gl(d.recvGroup) + (d.recvGroup !== d.guideGroup ? ' / ' + gl(d.guideGroup) : '') + '\\n'; });\n  const ta = $('gdayText'); ta.value = t; ta.classList.remove('hide'); ta.select();\n  try { document.execCommand('copy'); toast('คัดลอกแล้ว'); } catch (e) { toast('แตะค้างที่ข้อความแล้วเลือกคัดลอก'); }\n}\n\n// ---------- ดาวน์โหลด ----------\n// ---------- พิมพ์ PDF A4 แนวนอน: ตัวอักษรรายชื่อ 16pt แบ่งหน้าให้อัตโนมัติ ----------\nconst PRINT = { W: 1123, H: 794, PADY: 26, FIRSTCOL: 90 };\nfunction printPageEl(html, heightAuto){\n  const p = document.createElement('div');\n  p.className = 'paper pp';\n  p.style.cssText = 'position:fixed;left:-12000px;top:0;transform:none;' + (heightAuto ? 'height:auto;' : '');\n  p.innerHTML = html;\n  document.body.appendChild(p);\n  return p;\n}\n// วัดความสูงจริงของแถว/หัวตาราง/ส่วนท้าย แล้วจัดลงหน้า: แถวไหลต่อหน้า 2, 3 … ส่วนหน้าที่+หมายเหตุ+ลงชื่ออยู่หน้าสุดท้าย\n// (ถ้าท้ายตารางเหลือที่ไม่พอ ส่วนท้ายจะขึ้นหน้าใหม่ทั้งชุด)\nfunction planPrintPages(){\n  const P = rosterParts(), F = PRINT.FIRSTCOL;\n  const m = printPageEl(P.titleHTML + `<table>${P.headHTML(F)}<tbody>${P.days.map(P.rowHTML).join('')}<\/tbody><\/table>` + P.footerHTML(), true);\n  const m2 = printPageEl(P.shortTitleHTML + `<table>${P.headHTML(F)}<tbody><\/tbody><\/table>`, true);\n  const tb = m.querySelector('table'), tb2 = m2.querySelector('table');\n  const firstBlock = tb.offsetTop - PRINT.PADY + m.querySelector('thead').offsetHeight;   // หัวเรื่อง + หัวตาราง (หน้า 1)\n  const nextBlock = tb2.offsetTop - PRINT.PADY + m2.querySelector('thead').offsetHeight;  // หัวเรื่องสั้น + หัวตาราง (หน้าถัดไป)\n  const rowH = [...m.querySelectorAll('tbody tr')].map(r => r.offsetHeight + 1);\n  const footH = m.querySelector('.pgrid').offsetHeight + 16;\n  m.remove(); m2.remove();\n\n  const contentH = PRINT.H - 2 * PRINT.PADY;\n  const pages = [];\n  let cur = { rows: [], footer: false }, used = firstBlock;\n  P.days.forEach((d, i) => {\n    if (used + rowH[i] > contentH && cur.rows.length) { pages.push(cur); cur = { rows: [], footer: false }; used = nextBlock; }\n    cur.rows.push(d); used += rowH[i];\n  });\n  if (used + footH <= contentH) cur.footer = true;\n  pages.push(cur);\n  if (!cur.footer) pages.push({ rows: [], footer: true });\n\n  return pages.map((pg, k) => {\n    let h = k === 0 ? P.titleHTML : P.shortTitleHTML;\n    if (pg.rows.length) h += `<table>${P.headHTML(F)}<tbody>${pg.rows.map(P.rowHTML).join('')}<\/tbody><\/table>`;\n    if (pg.footer) h += P.footerHTML();\n    if (pages.length > 1) h += `<div class=\"pno\">หน้า ${k + 1}/${pages.length}<\/div>`;\n    return h;\n  });\n}\n// ---------- ดาวน์โหลดเป็นไฟล์ Excel (.xlsx) แก้ไขต่อได้ พิมพ์ A4 แนวนอน ----------\nasync function exportExcel(){\n  if (!state.days.length) return toast('ยังไม่มีตารางเวรให้ดาวน์โหลด', true);\n  if (typeof ExcelJS === 'undefined') return toast('โหลดไลบรารี Excel ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', true);\n  try {\n    const c = state.cfg, ym = state.ym || '';\n    const sub = ym ? 'ประจำเดือน ' + TH_M_FULL[+ym.slice(5)-1] + ' ' + thDigits(+ym.slice(0,4)+543) : '';\n    const nm = v => { if (!v) return '-'; const n = (state.nicks || {})[normName(v)]; return v + (n ? ' (' + n + ')' : ''); };\n    const FONT = { name: 'TH Sarabun New', size: 16 };\n    const thin = { style: 'thin', color: { argb: 'FF000000' } }, box = { top: thin, left: thin, bottom: thin, right: thin };\n    const wb = new ExcelJS.Workbook();\n    const ws = wb.addWorksheet('ตารางเวร', { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: .4, right: .4, top: .5, bottom: .5, header: .2, footer: .2 } } });\n    const widths = [14, 38, 38, 38, 38];\n    ws.columns = widths.map(w => ({ width: w }));\n    const put = (r, text, o = {}) => { const row = ws.getRow(r); const cell = row.getCell(o.col || 1); cell.value = text; cell.font = Object.assign({}, FONT, o.font || {}); cell.alignment = Object.assign({ vertical: 'middle', wrapText: true }, o.align || {}); return cell; };\n    let r = 1;\n    ws.mergeCells(r, 1, r, 5); put(r, c.title, { font: { bold: true, size: 18 }, align: { horizontal: 'center' } }); r++;\n    ws.mergeCells(r, 1, r, 5); put(r, sub, { font: { bold: true, size: 18 }, align: { horizontal: 'center' } }); r++;\n    const headRow = r;\n    [ 'วันที่', c.roleNtn, c.roleAsst, c.roleRecv, c.roleGuide ].forEach((h, i) => { const x = put(r, h, { col: i + 1, font: { bold: true }, align: { horizontal: 'center' } }); x.border = box; });\n    ws.getRow(r).height = 26; r++;\n    state.days.forEach(d => {\n      const vals = [ fmtThai(d.date), nm(d.ntn), nm(d.asst), nm(d.recvName), nm(d.guideName) ];\n      let lines = 1;\n      vals.forEach((v, i) => { const x = put(r, v, { col: i + 1, align: { horizontal: i === 0 ? 'center' : 'left' } }); x.border = box; if (i) lines = Math.max(lines, Math.ceil(String(v).length / 34)); });\n      ws.getRow(r).height = 22 * lines; r++;\n    });\n    ws.views = [{ state: 'frozen', ySplit: headRow }];\n    ws.pageSetup.printTitlesRow = headRow + ':' + headRow;\n    r++;\n    // หน้าที่ของแต่ละตำแหน่ง\n    const duty = (txt, verb) => { const L = String(txt || '').split('\\n').map(s => s.trim()).filter(Boolean); return verb + '\\n' + (L.length === 1 ? '- ' + L[0] : L.map((l, i) => thDigits(i + 1) + '. ' + l).join('\\n')); };\n    const dutyTxt = [ duty(c.dutyNtn, 'มีหน้าที่'), duty(c.dutyAsst, 'มีหน้าที่'), duty(c.dutyRecv, 'ทำหน้าที่'), duty(c.dutyGuide, 'ทำหน้าที่') ];\n    [ c.roleNtn, c.roleAsst, c.roleRecv, c.roleGuide ].forEach((h, i) => put(r, h, { col: i + 2, font: { bold: true }, align: { horizontal: 'center' } })); r++;\n    let maxL = 1;\n    dutyTxt.forEach((v, i) => { put(r, v, { col: i + 2, align: { vertical: 'top' } }); maxL = Math.max(maxL, v.split('\\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / 36)), 0)); });\n    ws.getRow(r).height = Math.min(409, 21 * maxL); r += 2;\n    // หมายเหตุ + ลงชื่อ\n    const notes = String(c.notes || '').split('\\n').map(s => s.trim()).filter(Boolean).map(s => '- ' + s);\n    put(r, 'หมายเหตุ', { font: { bold: true }, align: { vertical: 'top' } });\n    ws.mergeCells(r, 2, r, 3); put(r, notes.join('\\n'), { col: 2, align: { vertical: 'top' } });\n    ws.getRow(r).height = 21 * Math.max(3, notes.reduce((a, l) => a + Math.ceil(l.length / 75), 0));\n    const sp = signerParts(c), name = normName(sp.name);\n    const sig = [ c.signLabel || '', '(ลงชื่อ) ' + (sp.rank ? sp.rank + ' ' : '') + (name ? name.split(' ').join('  ') : '..............................') + (sp.suffix ? ' ' + sp.suffix : ''),\n                  '(' + (name ? name.split(' ').join('  ') : '................................') + ')', c.signerTitle || '', c.signDate ? fmtThai(c.signDate) : '' ];\n    ws.mergeCells(r, 4, r, 5); put(r, sig.join('\\n'), { col: 4, align: { horizontal: 'center', vertical: 'top' } });\n    ws.getRow(r).height = Math.max(ws.getRow(r).height, 21 * 5);\n    const buf = await wb.xlsx.writeBuffer();\n    saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'ตารางเวร_' + state.ym + '.xlsx');\n  } catch (e) { toast('สร้างไฟล์ Excel ไม่สำเร็จ: ' + (e.message || e), true); }\n}\nasync function exportPaper(kind){\n  if (!state.days.length) return toast('ยังไม่มีตารางเวรให้ดาวน์โหลด', true);\n  if (typeof html2canvas === 'undefined') return toast('โหลดไลบรารีภาพไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', true);\n  toast('กำลังสร้างไฟล์…');\n  const els = [];\n  try {\n    if (document.fonts && document.fonts.ready) await document.fonts.ready;\n    const base = 'ตารางเวร_' + state.ym;\n    if (kind === 'png') {\n      const clone = $('paper').cloneNode(true);\n      clone.removeAttribute('id'); clone.style.transform = 'none'; clone.style.position = 'fixed'; clone.style.left = '-12000px'; clone.style.top = '0';\n      document.body.appendChild(clone); els.push(clone);\n      const canvas = await html2canvas(clone, { scale: 2, backgroundColor: '#ffffff', useCORS: true });\n      canvas.toBlob(b => saveBlob(b, base + '.png'), 'image/png');\n    } else {\n      const htmls = planPrintPages();\n      const { jsPDF } = window.jspdf;\n      const pdf = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });\n      for (let k = 0; k < htmls.length; k++) {\n        const el = printPageEl(htmls[k], false); els.push(el);\n        const canvas = await html2canvas(el, { scale: 3, backgroundColor: '#ffffff', useCORS: true });\n        if (k) pdf.addPage('a4', 'l');\n        pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);\n      }\n      saveBlob(pdf.output('blob'), base + '.pdf');\n    }\n  } catch (e) { toast('สร้างไฟล์ไม่สำเร็จ: ' + (e.message || e), true); }\n  finally { els.forEach(x => x.remove()); }\n}\nfunction saveBlob(blob, name){ parent.postMessage({ k: 'save', blob, name }, '*'); }\n\n// ---------- แอดมินหมู่: ใส่ชื่อเวร ----------\nasync function groupLoad(){\n  await guard(document.querySelector('#s-group .btn'), async () => {\n    const ym = $('gMonth').value, g = ME.isSuper ? $('gSel').value : ME.group;\n    if (!ym) throw new Error('ยังไม่มีตารางเวรของเดือนนี้');\n    if (!g) throw new Error('บัญชีนี้ยังไม่มีหมู่ใน Roster');\n    const r = await call('dty_groupTasks', ym, g);\n    gSession = { g: r.group, ym };\n    const duty = { recv: state.cfg.roleRecv || 'เวรรับรองอาจารย์', guide: state.cfg.roleGuide || 'เวรแนะนำอาจารย์' };\n    const opts = cur => '<option value=\"\">— เลือกชื่อ —<\/option>' + r.people.map(p => `<option value=\"${esc(p)}\" ${p === cur ? 'selected' : ''}>${withNick(p, r.nicks)}<\/option>`).join('');\n    let h;\n    if (!r.tasks.length) h = '<div class=\"card\">' + esc(gl(r.group)) + ' ไม่มีเวรในเดือนที่เลือก<\/div>';\n    else {\n      const days = [...new Set(r.tasks.map(t => t.date))].map(fmtArabic).join(', ');\n      h = `<div class=\"card\"><h2>${esc(gl(r.group))}<\/h2><div class=\"warn\">วันที่หมู่ท่านเป็นเวร: ${days}<\/div>`;\n      r.tasks.forEach((t, i) => {\n        h += `<div class=\"task\"><div><b>${fmtArabic(t.date)}<\/b><br><span class=\"hint\">${esc(duty[t.duty])}<\/span><\/div>\n          <div class=\"f\"><select id=\"gn${i}\">${opts(t.name)}<\/select>\n          <button class=\"btn\" onclick=\"groupSave(this,${i},'${t.date}','${t.duty}')\">บันทึก<\/button><span id=\"gok${i}\" class=\"tick\">${t.name ? '✓ ใส่ชื่อแล้ว' : ''}<\/span><\/div><\/div>`;\n      });\n      h += '<\/div>';\n    }\n    $('gTasks').innerHTML = h;\n  });\n}\nasync function groupSave(btn, i, date, duty){\n  await guard(btn, async () => {\n    const name = $('gn'+i).value;\n    if (!name) throw new Error('กรุณาเลือกชื่อ');\n    await call('dty_saveName', gSession.g, date, duty, name);\n    $('gok'+i).textContent = '✓ บันทึกแล้ว'; toast('บันทึกแล้ว');\n  });\n}\n\n// ---------- แอดมินหลัก ----------\nfunction applyAdminData(r){\n  adminData = r; state.cfg = r.cfg; state.groups = r.groups;\n  $('allPeople').innerHTML = r.people.map(p => `<option value=\"${esc(p.name)}\">`).join('');\n  $('dutyUrl').value = r.cfg.dutySheet || '';\n  $('groupOrder').value = r.cfg.groupOrder || '';\n  $('groupOrderNow').textContent = 'ลำดับที่ระบบใช้ตอนนี้: ' + r.groups.map((g, i) => (i + 1) + '=' + gl(g)).join('  ');\n  const n = Object.keys(r.duty || {}).length;\n  $('dutyInfo').textContent = n ? 'มีข้อมูลนายทหารเวร ' + n + ' วัน' : 'ยังไม่มีข้อมูล — กด \"ดึงจากไฟล์\"';\n  $('genSG').innerHTML = groupOptions('', '(ต่อจากเดือนก่อน / หมู่แรก)');\n  if (!$('genMonth').value) { const gm = new Date(), next = new Date(gm.getFullYear(), gm.getMonth() + (gm.getDate() > 20 ? 1 : 0), 1); $('genMonth').value = next.getFullYear() + '-' + String(next.getMonth()+1).padStart(2,'0'); }\n  renderCfgForm(); renderEdit(); renderGenDays();\n}\nasync function adminReloadData(){ applyAdminData(await call('dty_adminLoad')); }\n\nasync function saveGroupOrder(){\n  await guard(null, async () => {\n    await call('dty_saveCfg', { groupOrder: $('groupOrder').value });\n    toast('บันทึกลำดับกลุ่มแล้ว'); await adminReloadData();\n  });\n}\nasync function syncDuty(){\n  await guard(null, async () => {\n    const r = await call('dty_syncDuty', $('dutyUrl').value);\n    toast('ดึงข้อมูลแล้ว ' + r.count + ' วัน' + (r.updated ? ' • อัปเดตตารางที่สร้างไว้ ' + r.updated + ' วัน' : ''));\n    await adminReloadData(); if (state.ym) await loadMonth(state.ym);\n  });\n}\nasync function pasteDuty(){\n  await guard(null, async () => {\n    const r = await call('dty_importDutyText', $('dutyPaste').value);\n    toast('นำเข้า ' + r.count + ' วัน' + (r.updated ? ' • อัปเดตตารางที่สร้างไว้ ' + r.updated + ' วัน' : ''));\n    await adminReloadData(); if (state.ym) await loadMonth(state.ym);\n  });\n}\n\nfunction renderGenDays(){\n  const v = $('genMonth').value; if (!v || !adminData) { $('genDays').innerHTML = ''; return; }\n  const [y, m] = v.split('-').map(Number); const last = new Date(y, m, 0).getDate();\n  const duty = adminData.duty || {};\n  const hasDuty = Object.keys(duty).some(k => k.slice(0,7) === v);\n  let h = '';\n  for (let d = 1; d <= last; d++) {\n    const dw = new Date(y, m-1, d).getDay(), iso = v + '-' + String(d).padStart(2,'0');\n    const on = hasDuty ? !!duty[iso] : (dw >= 1 && dw <= 5);\n    h += `<label><input type=\"checkbox\" value=\"${iso}\" ${on ? 'checked' : ''}> ${TH_DOW[dw]} ${d}<\/label>`;\n  }\n  $('genDays').innerHTML = h;\n}\nasync function generate(){\n  await guard(null, async () => {\n    const ym = $('genMonth').value; if (!ym) throw new Error('เลือกเดือนก่อน');\n    const dates = [...document.querySelectorAll('#genDays input:checked')].map(i => i.value);\n    if (!dates.length) throw new Error('ยังไม่ได้เลือกวันเรียน');\n    if (state.months.indexOf(ym) >= 0 && !confirm('เดือนนี้มีตารางอยู่แล้ว — สร้างใหม่ทั้งเดือน?')) return;\n    const r = await call('dty_generate', ym, dates, { startGroup: $('genSG').value });\n    toast('สร้างตารางเวร ' + r.count + ' วันแล้ว' + (r.noDuty ? ' (ไม่มีนายทหารเวร ' + r.noDuty + ' วัน — ตรวจข้อ 2)' : ''));\n    state.ym = ym; await init(); await adminReloadData(); tab('view');\n  });\n}\nasync function deleteMonth(){\n  await guard(null, async () => {\n    const ym = $('genMonth').value;\n    if (!ym || state.months.indexOf(ym) < 0) throw new Error('เดือนนี้ยังไม่มีตาราง');\n    if (!confirm('ลบตารางเวรเดือน ' + ymLabel(ym) + ' ทั้งหมด?')) return;\n    await call('dty_deleteMonth', ym);\n    toast('ลบแล้ว'); state.ym = ''; await init();\n  });\n}\n\nfunction renderEdit(){\n  const tbl = $('editTbl'); if (!tbl) return;\n  $('editMonthLbl').textContent = state.ym
